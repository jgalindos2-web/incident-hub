# Server Configuration
server.port=8080
server.servlet.context-path=/api/v1

# PostgreSQL Datasource Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/incident_hub_db}
spring.datasource.username=${DB_USERNAME:incident_user}
spring.datasource.password=${DB_PASSWORD:incident_pass_secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.root=INFO
logging.level.com.incidenthub=DEBUG
