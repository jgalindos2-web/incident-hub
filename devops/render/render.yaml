# ==============================================================================
# Blueprint de Infraestructura como Código (IaC) para Render
# Proyecto: IT Incident Hub
# Ubicación: devops/render/render.yaml
# ==============================================================================

databases:
  - name: incident-hub-db
    databaseName: incident_hub_db
    user: incident_user
    plan: free
    region: oregon
    postgresMajorVersion: "15"
    ipAllowList: [] # Solo servicios internos de Render pueden conectarse

services:
  # 1. Backend REST API (Spring Boot en Docker)
  - type: web
    name: incident-hub-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    healthCheckPath: /api/v1/actuator/health
    autoDeployTrigger: "off" # Despliegue solo por Deploy Hook desde tu pipeline
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: "8080"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75"
      - key: DB_HOST
        fromDatabase:
          name: incident-hub-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: incident-hub-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: incident-hub-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: incident-hub-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: incident-hub-db
          property: password
      - key: CORS_ALLOWED_ORIGINS
        sync: false # Se pone a mano en el Dashboard

  # 2. Frontend SPA (React + Vite) como sitio estático
  - type: web
    name: incident-hub-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: "off"
    envVars:
      - key: VITE_API_URL
        sync: false # Ej: https://incident-hub-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin