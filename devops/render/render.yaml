# ==============================================================================
# Blueprint de Infraestructura como Código (IaC) para Render PaaS
# Proyecto: IT Incident Hub
# Ubicación: devops/render/render.yaml
# ==============================================================================

databases:
  # ----------------------------------------------------------------------------
  # Servicio Gestionado de Base de Datos PostgreSQL 15
  # ----------------------------------------------------------------------------
  - name: incident-hub-db
    databaseName: incident_hub_db
    user: incident_user
    plan: free
    region: oregon
    ipAllowList: [] # Permite tráfico seguro dentro de la red privada de Render

services:
  # ----------------------------------------------------------------------------
  # 1. Backend REST API - Web Service (Spring Boot 3 / Java 17 en Contenedor)
  # ----------------------------------------------------------------------------
  - type: web
    name: incident-hub-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    healthCheckPath: /api/v1/actuator/health
    autoDeploy: false # Despliegue gobernado exclusivamente por Deploy Hooks de GitLab CI/CD
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: 8080
      - key: DB_URL
        fromDatabase:
          name: incident-hub-db
          property: jdbcConnectionString
      - key: DB_USERNAME
        fromDatabase:
          name: incident-hub-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: incident-hub-db
          property: password
      - key: CORS_ALLOWED_ORIGINS
        sync: false # Configurado de forma manual y segura en el Dashboard de Render

  # ----------------------------------------------------------------------------
  # 2. Frontend Web SPA - Static Site (React 18 + Vite)
  # ----------------------------------------------------------------------------
  - type: web
    name: incident-hub-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    region: oregon
    plan: free
    autoDeploy: false # Despliegue gobernado por Deploy Hooks
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: incident-hub-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      # Regla de reescritura para enrutamiento SPA con React Router
      - type: rewrite
        source: /*
        destination: /index.html
      # Cabeceras de seguridad HTTP en producción
      - type: header
        source: /*
        headers:
          - key: X-Frame-Options
            value: DENY
          - key: X-Content-Type-Options
            value: nosniff
          - key: Referrer-Policy
            value: strict-origin-when-cross-origin
