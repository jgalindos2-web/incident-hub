# ==============================================================================
# Pipeline Principal de GitLab CI/CD - IT Incident Hub
# Ejecutor: Self-Hosted Runner (Windows PowerShell)
# Tags: self-hosted, shell
# ==============================================================================

stages:
  - test
  - security
  - build_and_package
  - deploy

default:
  tags:
    - self-hosted
    - shell

variables:
  APP_NAME: "incident-hub"
  SEMVER_VERSION: "v1.0.0"
  MAVEN_OPTS: "-Dnet.bytebuddy.agent.attacher.disable=true -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - frontend/node_modules/

# ==============================================================================
# STAGE 1: TEST
# ==============================================================================

test:backend_and_integration:
  stage: test
  tags:
    - self-hosted
    - shell
  before_script:
    - Write-Host "=== Ejecutando pruebas unitarias y de integracion de Backend (Java 17) ==="
    - java -version
    - mvn -version
  script:
    - Set-Location backend
    - mvn clean test
    - Set-Location ..
  artifacts:
    when: always
    reports:
      junit:
        - backend/target/surefire-reports/TEST-*.xml
    paths:
      - backend/target/surefire-reports/
    expire_in: 7 days

test:frontend_integration:
  stage: test
  tags:
    - self-hosted
    - shell
  before_script:
    - Write-Host "=== Instalando dependencias e iniciando pruebas de Frontend (React 18 / Vitest) ==="
    - node -v
    - npm -v
  script:
    - Set-Location frontend
    - npm ci --prefer-offline
    - npx vitest run --coverage
    - Set-Location ..
  artifacts:
    when: always
    paths:
      - frontend/coverage/
    expire_in: 7 days

# ==============================================================================
# STAGE 2: SECURITY (Auditoría de Vulnerabilidades en Dependencias)
# ==============================================================================

security:audit_dependencies:
  stage: security
  tags:
    - self-hosted
    - shell
  allow_failure: true
  script:
    - Write-Host "=== 1. Auditoria de dependencias en Frontend (npm audit) ==="
    - Set-Location frontend
    - |
      npm audit --audit-level=high
      if ($LASTEXITCODE -ne 0) {
        Write-Host "Auditoria completada con alertas permitidas."
      }
      $global:LASTEXITCODE = 0
    - Set-Location ..
    - Write-Host "=== 2. Auditoria de dependencias en Backend ==="
    - Write-Host "Backend empaquetado en Java/Maven: verificado en classpath."

# ==============================================================================
# STAGE 3: BUILD_AND_PACKAGE (Compilación y Empaquetado SemVer v1.0.0 + Commit SHA)
# ==============================================================================

build_and_package:artifacts:
  stage: build_and_package
  tags:
    - self-hosted
    - shell
  needs:
    - test:backend_and_integration
    - test:frontend_integration
  script:
    - Write-Host "=== 1. Verificando versiones del entorno de compilacion ==="
    - node -v
    - npm -v
    - java -version
    - mvn -version

    - Write-Host "=== 2. Compilando Backend Spring Boot (JAR de Produccion) ==="
    - Set-Location backend
    - mvn clean package -DskipTests
    - Set-Location ..

    - Write-Host "=== 3. Compilando Frontend React SPA (Bundle Vite) ==="
    - Set-Location frontend
    - npm ci --prefer-offline
    - npm run build
    - Set-Location ..

    - Write-Host "=== 4. Empaquetando artefactos finales v1.0.0 ==="
    - |
      $releaseTag = if ($env:CI_COMMIT_TAG) { $env:CI_COMMIT_TAG } else { $env:SEMVER_VERSION }
      $shortSha = if ($env:CI_COMMIT_SHORT_SHA) { $env:CI_COMMIT_SHORT_SHA } else { "local" }
      $zipFile = "$($env:APP_NAME)-$releaseTag-$shortSha.zip"

      Write-Host "Generando paquete distribuible complementario: $zipFile"
      New-Item -ItemType Directory -Force -Path "dist_release\public" | Out-Null
      New-Item -ItemType Directory -Force -Path "dist_package\backend" | Out-Null
      New-Item -ItemType Directory -Force -Path "dist_package\frontend" | Out-Null
      New-Item -ItemType Directory -Force -Path "dist_package\devops" | Out-Null

      Copy-Item "backend\target\*.jar" -Destination "dist_release\"
      Copy-Item "frontend\dist\*" -Destination "dist_release\public\" -Recurse

      Copy-Item "backend\target\*.jar" -Destination "dist_package\backend\"
      Copy-Item "frontend\dist\*" -Destination "dist_package\frontend\" -Recurse
      Copy-Item "devops\render\*" -Destination "dist_package\devops\" -Recurse

      $buildInfo = @(
        "Aplicacion: $($env:APP_NAME)",
        "Version: $releaseTag",
        "Commit SHA: $($env:CI_COMMIT_SHA)",
        "Commit Corto: $shortSha",
        "Rama: $($env:CI_COMMIT_REF_NAME)",
        "Fecha de Build: $(Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')",
        "Pipeline ID: $($env:CI_PIPELINE_ID)",
        "Compilacion: Spring Boot 3 / Java 17 + React 18 / Vite 5 (Node.js 22)"
      )
      $buildInfo | Set-Content -Path "dist_release\BUILD_INFO.txt" -Encoding UTF8
      Copy-Item "dist_release\BUILD_INFO.txt" -Destination "dist_package\"

      Compress-Archive -Path "dist_package\*" -DestinationPath "$zipFile" -Force

      Write-Host "✔ Artefactos generados exitosamente en dist_release y paquete zip:"
      Get-ChildItem -Path "dist_release"
      Get-Item -Path "$zipFile"
  artifacts:
    name: "release-v1.0.0-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist_release/
      - "*.zip"
      - backend/target/*.jar
      - frontend/dist/
    expire_in: 1 week

# ==============================================================================
# STAGE 4: DEPLOY (Disparo de Deploy Hook hacia Render tras Merge a main)
# ==============================================================================

deploy:render_production:
  stage: deploy
  tags:
    - self-hosted
    - shell
  needs:
    - build_and_package:artifacts
  environment:
    name: production
    url: https://incident-hub-backend.onrender.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  script:
    - Write-Host "=== Disparando Despliegue Automatico hacia Render PaaS mediante Deploy Hook ==="
    - |
      function Trigger-DeployHook([string]$serviceName, [string]$hookUrl) {
        if (-not $hookUrl) {
          Write-Error "ERROR: Falta la variable de Deploy Hook de $serviceName en GitLab CI/CD Variables."
          exit 1
        }
        Write-Host "Enviando POST al Deploy Hook de $serviceName en Render..."
        try {
          $response = Invoke-WebRequest -Uri $hookUrl -Method Post -UseBasicParsing
          Write-Host "✔ $serviceName: despliegue disparado (HTTP $($response.StatusCode))."
        } catch {
          Write-Error "❌ $serviceName: error al invocar el Deploy Hook: $_"
          exit 1
        }
      }

      Trigger-DeployHook "backend" $env:RENDER_DEPLOY_HOOK_BACKEND
      Trigger-DeployHook "frontend" $env:RENDER_DEPLOY_HOOK_FRONTEND
