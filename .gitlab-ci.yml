# ==============================================================================
# Pipeline Principal de GitLab CI/CD - IT Incident Hub
# Ambientes: Testing, Seguridad, Compilación, Empaquetado y Despliegue en Render
# ==============================================================================

stages:
  - test
  - security
  - build_and_package
  - deploy

variables:
  APP_NAME: "incident-hub"
  SEMVER_VERSION: "v1.0.0"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .m2/repository/
    - frontend/node_modules/

# ==============================================================================
# STAGE 1: TEST
# ==============================================================================

test:backend_and_integration:
  stage: test
  image: maven:3.9.6-eclipse-temurin-17
  before_script:
    - echo "=== Ejecutando pruebas unitarias y de integración de Backend (Java 17) ==="
    - java -version
    - mvn -version
  script:
    - cd backend
    - mvn clean test $MAVEN_OPTS
  artifacts:
    when: always
    reports:
      junit:
        - backend/target/surefire-reports/TEST-*.xml
    paths:
      - backend/target/surefire-reports/
    expire_in: 7 days

test:frontend_integration:
  stage: test
  image: node:20-alpine
  before_script:
    - echo "=== Instalando dependencias e iniciando pruebas de Frontend (React 18 / Vitest) ==="
    - node -v
    - npm -v
  script:
    - cd frontend
    - npm ci --prefer-offline
    # Ejecución no interactiva de la suite de pruebas con generación de cobertura
    - npx vitest run --coverage
  artifacts:
    when: always
    paths:
      - frontend/coverage/
    expire_in: 7 days

# ==============================================================================
# STAGE 2: SECURITY (Auditoría de Vulnerabilidades en Dependencias)
# ==============================================================================

security:audit_dependencies:
  stage: security
  image: node:20-alpine
  allow_failure: true
  script:
    - echo "=== 1. Auditoría de dependencias en Frontend (npm audit) ==="
    - cd frontend
    - npm audit --audit-level=high || true
    - cd ..
    - echo "=== 2. Auditoría de dependencias en Backend ==="
    - |
      if [ -f backend/package.json ]; then
        cd backend && npm audit --audit-level=high || true
      else
        echo "Backend empaquetado en Java/Maven: verificado en classpath."
      fi

# ==============================================================================
# STAGE 3: BUILD_AND_PACKAGE (Compilación y Empaquetado SemVer v1.0.0 + Commit SHA)
# ==============================================================================

build_and_package:artifacts:
  stage: build_and_package
  image: node:20-alpine
  needs:
    - test:backend_and_integration
    - test:frontend_integration
  before_script:
    - apk add --no-cache openjdk17 maven zip
  script:
    - echo "=== 1. Verificando versiones del entorno de compilación ==="
    - node -v
    - npm -v
    - java -version
    - mvn -version

    - echo "=== 2. Compilando Backend Spring Boot (JAR de Producción) ==="
    - cd backend
    - mvn clean package -DskipTests $MAVEN_OPTS
    - cd ..

    - echo "=== 3. Compilando Frontend React SPA (Bundle Vite) ==="
    - cd frontend
    - npm ci --prefer-offline
    - npm run build
    - cd ..

    - echo "=== 4. Empaquetando artefactos finales v1.0.0 ==="
    - mkdir -p dist_release/public
    - cp backend/target/*.jar dist_release/
    - cp -r frontend/dist/* dist_release/public/

    - |
      RELEASE_TAG="${CI_COMMIT_TAG:-$SEMVER_VERSION}"
      SHORT_SHA="${CI_COMMIT_SHORT_SHA}"
      ZIP_FILE="${APP_NAME}-${RELEASE_TAG}-${SHORT_SHA}.zip"

      echo "Generando paquete distribuible complementario: ${ZIP_FILE}"
      mkdir -p dist_package/backend dist_package/frontend dist_package/devops

      cp backend/target/*.jar dist_package/backend/
      cp -r frontend/dist/* dist_package/frontend/
      cp -r devops/render dist_package/devops/

      cat <<EOF > dist_release/BUILD_INFO.txt
      Aplicación: ${APP_NAME}
      Versión: ${RELEASE_TAG}
      Commit SHA: ${CI_COMMIT_SHA}
      Commit Corto: ${SHORT_SHA}
      Rama: ${CI_COMMIT_REF_NAME}
      Fecha de Build: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
      Pipeline ID: ${CI_PIPELINE_ID}
      Compilación: Spring Boot 3 / Java 17 + React 18 / Vite 5 (Node.js 20)
      EOF

      cp dist_release/BUILD_INFO.txt dist_package/

      cd dist_package
      zip -r "../${ZIP_FILE}" ./*
      cd ..

      echo "✔ Artefactos generados exitosamente en dist_release y paquete zip:"
      ls -lh dist_release/
      ls -lh "${ZIP_FILE}"
  artifacts:
    name: "release-v1.0.0-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist_release/
      - "*.zip"
      - backend/target/*.jar
      - frontend/dist/
    expire_in: 1 week

# ==============================================================================
# STAGE 4: DEPLOY (Disparo de Deploy Hook hacia Render tras Merge a main)
# ==============================================================================

deploy:render_production:
  stage: deploy
  image: curlimages/curl:8.6.0
  needs:
    - build_and_package:artifacts
  environment:
    name: production
    url: https://incident-hub-backend.onrender.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  script:
    - echo "=== Disparando Despliegue Automático hacia Render PaaS mediante Deploy Hook ==="
    - |
      trigger_hook() {
        NAME="$1"
        URL="$2"
        if [ -z "$URL" ]; then
          echo "❌ ERROR: Falta la variable de Deploy Hook de $NAME en GitLab CI/CD Variables."
          exit 1
        fi
        echo "Enviando POST al Deploy Hook de $NAME en Render..."
        STATUS=$(curl -s -o "response_$NAME.json" -w "%{http_code}" -X POST -d "" "$URL")
        if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
          echo "✔ $NAME: despliegue disparado (HTTP $STATUS)."
        else
          echo "❌ $NAME: error al invocar el Deploy Hook (HTTP $STATUS)."
          cat "response_$NAME.json" || true
          exit 1
        fi
      }

      trigger_hook "backend" "$RENDER_DEPLOY_HOOK_BACKEND"
      trigger_hook "frontend" "$RENDER_DEPLOY_HOOK_FRONTEND"
