stages:
  - .pre
  - test
  - security
  - build_and_package
  - deploy
  - .post

default:
  tags:
    - self-hosted
    - shell

variables:
  APP_NAME: incident-hub
  SEMVER_VERSION: v1.0.0
  MAVEN_OPTS: "-Dnet.bytebuddy.agent.attacher.disable=true -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN"
  ARTIFACT_COMPRESSION_LEVEL: "fastest"
  FF_USE_FASTZIP: "true"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - frontend/node_modules/

# Regla compartida: estos jobs corren solo en ramas feature, no en main
.solo_ramas_feature:
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

# ==============================================================================
# STAGE 1: TEST
# ==============================================================================

test:backend_and_integration:
  extends: .solo_ramas_feature
  stage: test
  tags:
    - self-hosted
    - shell
  before_script:
    - Write-Host "=== Ejecutando pruebas unitarias y de integracion de Backend (Java 17) ==="
    - java -version
    - mvn -version
  script:
    - mvn -f backend/pom.xml clean test "-Dnet.bytebuddy.agent.attacher.disable=true"
  artifacts:
    when: always
    reports:
      junit:
        - backend/target/surefire-reports/TEST-*.xml
    paths:
      - backend/target/surefire-reports/
    expire_in: 7 days

test:frontend_integration:
  extends: .solo_ramas_feature
  stage: test
  tags:
    - self-hosted
    - shell
  before_script:
    - $env:PATH = "C:\Program Files\nodejs;" + $env:PATH
    - Write-Host "=== Instalando dependencias e iniciando pruebas de Frontend (React 18 / Vitest) ==="
    - node -v
    - npm -v
  script:
    - Set-Location frontend
    - npm ci --prefer-offline
    - npx vitest run --coverage
    - Set-Location ..
  artifacts:
    when: always
    paths:
      - frontend/coverage/
    expire_in: 7 days

# ==============================================================================
# STAGE 2: SECURITY
# ==============================================================================

security:audit_dependencies:
  extends: .solo_ramas_feature
  stage: security
  tags:
    - self-hosted
    - shell
  allow_failure: true
  before_script:
    - $env:PATH = "C:\Program Files\nodejs;" + $env:PATH
  script:
    - Write-Host "=== 1. Auditoria de dependencias en Frontend (npm audit) ==="
    - Set-Location frontend
    - 'npm audit --audit-level=high; if ($LASTEXITCODE -ne 0) { Write-Host "Auditoria completada con alertas permitidas." }'
    - Set-Location ..
    - Write-Host "=== 2. Auditoria de dependencias en Backend ==="
    - 'Write-Host "Backend empaquetado en Java/Maven: verificado en classpath."'

# ==============================================================================
# STAGE 3: BUILD_AND_PACKAGE (Separados por componente)
# ==============================================================================

build_and_package:backend:
  extends: .solo_ramas_feature
  stage: build_and_package
  tags:
    - self-hosted
    - shell
  needs:
    - test:backend_and_integration
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - stuck_or_timeout_failure
  script:
    - Write-Host "=== 1. Verificando entorno de compilacion Backend (Java 17 / Maven) ==="
    - java -version
    - mvn -version
    - Write-Host "=== 2. Compilando Backend Spring Boot (JAR de Produccion) ==="
    - mvn -f backend/pom.xml clean package -DskipTests "-Dnet.bytebuddy.agent.attacher.disable=true"
    - Write-Host "=== 3. Preparando paquete distribuible de Backend ==="
    - |
      $appName = if ($env:APP_NAME) { $env:APP_NAME } else { "incident-hub" }
      $releaseTag = if ($env:CI_COMMIT_TAG) { $env:CI_COMMIT_TAG } else { $env:SEMVER_VERSION }
      $shortSha = if ($env:CI_COMMIT_SHORT_SHA) { $env:CI_COMMIT_SHORT_SHA } else { "local" }
      $commitSha = if ($env:CI_COMMIT_SHA) { $env:CI_COMMIT_SHA } else { "local-sha" }
      $branch = if ($env:CI_COMMIT_REF_NAME) { $env:CI_COMMIT_REF_NAME } else { "local-branch" }
      $pipelineId = if ($env:CI_PIPELINE_ID) { $env:CI_PIPELINE_ID } else { "0" }
      $distDir = "dist_backend"

      if (Test-Path $distDir) { Remove-Item -Path $distDir -Recurse -Force }
      New-Item -ItemType Directory -Force -Path $distDir | Out-Null

      Copy-Item "backend/target/*.jar" -Destination $distDir -Force
      Copy-Item "devops/distribution/backend/*" -Destination $distDir -Recurse -Force
      if (Test-Path ".env.example") {
        Copy-Item ".env.example" -Destination "$distDir/environment.env.example" -Force
      }

      $buildInfo = @(
        "Aplicacion: $appName-backend",
        "Version: $releaseTag",
        "Commit SHA: $commitSha",
        "Commit Corto: $shortSha",
        "Rama: $branch",
        "Fecha de Build: $(Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')",
        "Pipeline ID: $pipelineId",
        "Compilacion: Spring Boot 3.2.5 / Java 17 LTS (Eclipse Temurin)"
      )
      $buildInfo | Set-Content -Path "$distDir/BUILD_INFO.txt" -Encoding UTF8

      Write-Host "[OK] Paquete Backend preparado exitosamente en $distDir:"
      Get-ChildItem -Path $distDir | Select-Object Name, Length
  artifacts:
    name: backend-$CI_COMMIT_SHORT_SHA
    paths:
      - dist_backend/
    expire_in: 1 week

build_and_package:frontend:
  extends: .solo_ramas_feature
  stage: build_and_package
  tags:
    - self-hosted
    - shell
  needs:
    - test:frontend_integration
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - stuck_or_timeout_failure
  before_script:
    - $env:PATH = "C:\Program Files\nodejs;" + $env:PATH
  script:
    - Write-Host "=== 1. Verificando entorno de compilacion Frontend (Node.js / npm) ==="
    - node -v
    - npm -v
    - Write-Host "=== 2. Compilando Frontend React SPA (Bundle Vite) ==="
    - Set-Location frontend
    - npm ci --prefer-offline
    - npm run build
    - Set-Location ..
    - Write-Host "=== 3. Preparando paquete distribuible de Frontend ==="
    - |
      $appName = if ($env:APP_NAME) { $env:APP_NAME } else { "incident-hub" }
      $releaseTag = if ($env:CI_COMMIT_TAG) { $env:CI_COMMIT_TAG } else { $env:SEMVER_VERSION }
      $shortSha = if ($env:CI_COMMIT_SHORT_SHA) { $env:CI_COMMIT_SHORT_SHA } else { "local" }
      $commitSha = if ($env:CI_COMMIT_SHA) { $env:CI_COMMIT_SHA } else { "local-sha" }
      $branch = if ($env:CI_COMMIT_REF_NAME) { $env:CI_COMMIT_REF_NAME } else { "local-branch" }
      $pipelineId = if ($env:CI_PIPELINE_ID) { $env:CI_PIPELINE_ID } else { "0" }
      $distDir = "dist_frontend"

      if (Test-Path $distDir) { Remove-Item -Path $distDir -Recurse -Force }
      New-Item -ItemType Directory -Force -Path "$distDir/dist" | Out-Null

      Copy-Item "frontend/dist/*" -Destination "$distDir/dist" -Recurse -Force
      Copy-Item "devops/distribution/frontend/*" -Destination $distDir -Recurse -Force

      $buildInfoFront = @(
        "Aplicacion: $appName-frontend",
        "Version: $releaseTag",
        "Commit SHA: $commitSha",
        "Commit Corto: $shortSha",
        "Rama: $branch",
        "Fecha de Build: $(Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')",
        "Pipeline ID: $pipelineId",
        "Compilacion: React 18 / Vite 5.2 - Node.js 22 LTS"
      )
      $buildInfoFront | Set-Content -Path "$distDir\BUILD_INFO.txt" -Encoding UTF8

      Write-Host "[OK] Paquete Frontend preparado exitosamente en $distDir:"
      Get-ChildItem -Path "$distDir" -Recurse | Select-Object Name, Length
  artifacts:
    name: frontend-$CI_COMMIT_SHORT_SHA
    paths:
      - dist_frontend/
    expire_in: 1 week

# ==============================================================================
# STAGE 4: DEPLOY (solo en main, sin repetir test/build)
# ==============================================================================

deploy:render_production:
  stage: deploy
  tags:
    - self-hosted
    - shell
  needs: []
  environment:
    name: production
    url: https://incident-hub-backend.onrender.com
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
  script:
    - Write-Host "=== Disparando Despliegue Automatico hacia Render PaaS mediante Deploy Hook ==="
    - |
      function Trigger-DeployHook([string]$serviceName, [string]$hookUrl) {
        if (-not $hookUrl) {
          Write-Error "ERROR: Falta la variable de Deploy Hook de ${serviceName} en GitLab CI/CD Variables."
          exit 1
        }
        Write-Host "Enviando POST al Deploy Hook de ${serviceName} en Render..."
        try {
          $response = Invoke-WebRequest -Uri $hookUrl -Method Post -UseBasicParsing
          Write-Host "OK - ${serviceName}: despliegue disparado (HTTP $($response.StatusCode))."
        } catch {
          Write-Error "FALLO - ${serviceName}: error al invocar el Deploy Hook: $_"
          exit 1
        }
      }

      Trigger-DeployHook "backend" $env:RENDER_DEPLOY_HOOK_BACKEND
      Trigger-DeployHook "frontend" $env:RENDER_DEPLOY_HOOK_FRONTEND