name: Production Release (GitHub Actions)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de versión formal a validar y publicar (ej. v1.0.1 o v0.0.0-rc.1)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref_name || inputs.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ============================================================================
  # FASE 1: RESOLUCIÓN DE REFERENCIA, COMPUERTA DE CALIDAD Y PRUEBAS OBLIGATORIAS
  # ============================================================================
  quality-gate-and-test:
    name: 🛡️ Compuerta de Calidad y Pruebas Obligatorias
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    outputs:
      target_tag: ${{ steps.resolve-tag.outputs.target_tag }}
      resolved_sha: ${{ steps.resolve-tag.outputs.resolved_sha }}
      short_sha: ${{ steps.resolve-tag.outputs.short_sha }}
      is_prerelease: ${{ steps.resolve-tag.outputs.is_prerelease }}

    steps:
      - name: 📥 Clonar Repositorio Completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Validar y Resolver Tag y Commit SHA
        id: resolve-tag
        env:
          RAW_INPUT_TAG: ${{ inputs.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          echo "=== Determinando referencia de versión ==="
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            TARGET_TAG=$(echo "${RAW_INPUT_TAG}" | tr -d '[:space:]')
          else
            if [ "${REF_TYPE}" != "tag" ]; then
              echo "::error::El evento disparador no corresponde a un tag de Git. ref_type=${REF_TYPE}"
              exit 1
            fi
            TARGET_TAG="${REF_NAME}"
          fi

          echo "Tag objetivo detectado: '${TARGET_TAG}'"

          # 1. Validación estricta de formato SemVer (ej. v1.0.1, v0.0.0-rc.1, v1.1.0-beta.2)
          SEMVER_REGEX='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ ! "${TARGET_TAG}" =~ ${SEMVER_REGEX} ]]; then
            echo "::error::El tag '${TARGET_TAG}' no cumple con la especificación SemVer oficial. Formato requerido: vX.Y.Z o vX.Y.Z-prerelease (ej. v1.0.1, v0.0.0-rc.1)."
            exit 1
          fi

          # 2. Asegurar que las referencias de tags estén actualizadas
          git fetch --tags --force

          # 3. Validar que exista una referencia formal de tag y no una rama
          if ! git rev-parse --verify "refs/tags/${TARGET_TAG}" >/dev/null 2>&1; then
            echo "::error::La referencia 'refs/tags/${TARGET_TAG}' no existe como tag en el repositorio. No se permite publicar sobre ramas o commits no etiquetados."
            exit 1
          fi

          # 4. Resolver el SHA del commit real (desreferenciando tags anotados mediante ^{commit})
          RESOLVED_COMMIT_SHA=$(git rev-parse "refs/tags/${TARGET_TAG}^{commit}")
          if [ -z "${RESOLVED_COMMIT_SHA}" ]; then
            echo "::error::No se pudo resolver el commit SHA del tag '${TARGET_TAG}'."
            exit 1
          fi

          SHORT_SHA=$(git rev-parse --short "${RESOLVED_COMMIT_SHA}")

          # 5. Determinar automáticamente estado de pre-release según presencia de guion
          if [[ "${TARGET_TAG}" == *"-"* ]]; then
            IS_PRE="true"
          else
            IS_PRE="false"
          fi

          echo "✔ Tag verificado              : ${TARGET_TAG}"
          echo "✔ Commit SHA resuelto          : ${RESOLVED_COMMIT_SHA}"
          echo "✔ Commit Corto                 : ${SHORT_SHA}"
          echo "✔ Clasificación Pre-release    : ${IS_PRE}"

          echo "target_tag=${TARGET_TAG}" >> "$GITHUB_OUTPUT"
          echo "resolved_sha=${RESOLVED_COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRE}" >> "$GITHUB_OUTPUT"

      - name: 📌 Checkout al Commit Exacto Resuelto
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-tag.outputs.resolved_sha }}
          fetch-depth: 0

      - name: ☕ Configurar Java 17 LTS (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🟩 Configurar Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # --- Validación de Backend ---
      - name: 🧪 Ejecutar Pruebas Unitarias y de Integración de Backend
        run: |
          echo "=== [COMPUERTA DE CALIDAD] Ejecutando suite de pruebas de Backend ==="
          mvn -f backend/pom.xml clean test -B

      - name: 🛡️ Ejecutar Auditoría de Dependencias de Backend
        run: |
          echo "=== [COMPUERTA DE CALIDAD] Ejecutando auditoría de seguridad de dependencias ==="
          node backend/scripts/audit-backend-dependencies.js

      - name: 🔍 Validar Integridad de Scripts DevSecOps
        run: |
          echo "=== [COMPUERTA DE CALIDAD] Validando scripts DevSecOps con pruebas unitarias ==="
          node backend/scripts/test-security-scripts.js

      # --- Validación de Frontend ---
      - name: 📦 Instalar Dependencias Reproducibles de Frontend
        working-directory: frontend
        run: |
          echo "=== [COMPUERTA DE CALIDAD] Instalando dependencias con npm ci ==="
          npm ci --prefer-offline

      - name: 🧪 Ejecutar Pruebas de Frontend con Cobertura
        working-directory: frontend
        run: |
          echo "=== [COMPUERTA DE CALIDAD] Ejecutando suite de pruebas de Frontend ==="
          npx vitest run --coverage

      - name: 🔨 Compilar y Verificar Bundle de Frontend
        working-directory: frontend
        run: |
          echo "=== [COMPUERTA DE CALIDAD] Compilando frontend y verificando bundle ==="
          npm run build
          npm run verify-bundle

      - name: ✅ Confirmación de Aprobación
        run: |
          echo "✔ COMPUERTA DE CALIDAD APROBADA exitosamente para el tag ${{ steps.resolve-tag.outputs.target_tag }} en el commit ${{ steps.resolve-tag.outputs.resolved_sha }}."

  # ============================================================================
  # FASE 2: EMPAQUETADO, VERIFICACIÓN DE SECRETOS, CHECKSUMS Y PUBLICACIÓN
  # ============================================================================
  package-and-publish:
    name: 🚀 Empaquetado, Checksums y Publicación de Release
    needs: quality-gate-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    env:
      EXPECTED_TAG: ${{ needs.quality-gate-and-test.outputs.target_tag }}
      EXPECTED_SHA: ${{ needs.quality-gate-and-test.outputs.resolved_sha }}
      EXPECTED_SHORT_SHA: ${{ needs.quality-gate-and-test.outputs.short_sha }}
      IS_PRERELEASE: ${{ needs.quality-gate-and-test.outputs.is_prerelease }}

    steps:
      - name: 📥 Clonar Repositorio en Commit Exacto
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0

      - name: 🛡️ Verificar Integridad del Tag y No Existencia Previa de Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "=== 1. Verificando que el tag no haya mutado entre jobs ==="
          git fetch --tags --force
          CURRENT_TAG_SHA=$(git rev-parse "refs/tags/${EXPECTED_TAG}^{commit}")

          if [ "${CURRENT_TAG_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "::error::Integridad de tag comprometida: 'refs/tags/${EXPECTED_TAG}' apunta a ${CURRENT_TAG_SHA}, pero fue validado en ${EXPECTED_SHA}."
            exit 1
          fi
          echo "✔ El tag '${EXPECTED_TAG}' coincide exactamente con el commit validado (${EXPECTED_SHA})."

          echo "=== 2. Comprobando que no exista un Release previo para ${EXPECTED_TAG} ==="
          if gh release view "${EXPECTED_TAG}" >/dev/null 2>&1; then
            echo "::error::El Release '${EXPECTED_TAG}' ya existe en GitHub. Para prevenir sobrescrituras accidentales de binarios, la publicación aborta."
            exit 1
          fi
          echo "✔ Verificación exitosa: No existe Release previo con el tag '${EXPECTED_TAG}'."

      - name: ☕ Configurar Java 17 LTS (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🟩 Configurar Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ------------------------------------------------------------------------
      # Empaquetado Seguro de Backend
      # ------------------------------------------------------------------------
      - name: 🔨 Compilar, Inspeccionar y Empaquetar Backend
        run: |
          set -euo pipefail

          echo "=== 1. Compilando Backend con Maven (sin repetir pruebas ya aprobadas) ==="
          mvn -f backend/pom.xml clean package -DskipTests -B

          echo "=== 2. Identificación unívoca del JAR ejecutable de Spring Boot ==="
          JAR_CANDIDATES=( $(find backend/target -maxdepth 1 -name "*.jar" ! -name "*.jar.original" ! -name "*-sources.jar" ! -name "*-javadoc.jar") )

          if [ ${#JAR_CANDIDATES[@]} -eq 0 ]; then
            echo "::error::No se encontró ningún archivo .jar ejecutable en backend/target/"
            exit 1
          elif [ ${#JAR_CANDIDATES[@]} -gt 1 ]; then
            echo "::error::Selección ambigua: Se encontraron múltiples JARs ejecutables en backend/target/: ${JAR_CANDIDATES[*]}"
            exit 1
          fi

          EXECUTABLE_JAR="${JAR_CANDIDATES[0]}"
          echo "✔ JAR ejecutable identificado unívocamente: ${EXECUTABLE_JAR}"

          echo "=== 3. Preparando estructura de distribución de Backend ==="
          DIST_DIR="dist_backend"
          rm -rf "${DIST_DIR}"
          mkdir -p "${DIST_DIR}"

          # Copiar el JAR ejecutable identificado (preservando el nombre del artefacto)
          cp "${EXECUTABLE_JAR}" "${DIST_DIR}/"
          cp backend/pom.xml "${DIST_DIR}/"
          if [ -d "devops/distribution/backend" ]; then
            cp -r devops/distribution/backend/* "${DIST_DIR}/"
          fi

          # Metadatos del build basados en el SHA resuelto
          {
            echo "Aplicacion: incident-hub-backend"
            echo "Version: ${EXPECTED_TAG}"
            echo "Commit SHA: ${EXPECTED_SHA}"
            echo "Commit Corto: ${EXPECTED_SHORT_SHA}"
            echo "Fecha de Build: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "Plataforma: GitHub Actions (ubuntu-latest)"
            echo "Entorno: Java 17 LTS / Spring Boot 3.2.12"
          } > "${DIST_DIR}/BUILD_INFO.txt"

          echo "=== 4. Inspección profunda de secretos en artefactos de Backend ==="
          node backend/scripts/verify-backend-secrets.js "${DIST_DIR}"

          BACKEND_ZIP="incident-hub-backend-${EXPECTED_TAG}-${EXPECTED_SHORT_SHA}.zip"
          (cd "${DIST_DIR}" && zip -r "../${BACKEND_ZIP}" *)
          echo "BACKEND_ZIP=${BACKEND_ZIP}" >> "$GITHUB_ENV"
          echo "✔ Paquete Backend generado: ${BACKEND_ZIP}"

      # ------------------------------------------------------------------------
      # Empaquetado Seguro de Frontend
      # ------------------------------------------------------------------------
      - name: 🚀 Compilar, Inspeccionar y Empaquetar Frontend
        run: |
          set -euo pipefail

          echo "=== 1. Compilando bundle de Frontend con Vite ==="
          cd frontend
          npm ci --prefer-offline
          npm run build
          cd ..

          echo "=== 2. Inspección de secretos en bundle recién generado ==="
          node frontend/scripts/verify-bundle-secrets.js

          echo "=== 3. Preparando estructura de distribución de Frontend ==="
          DIST_FRONT="dist_frontend"
          rm -rf "${DIST_FRONT}"
          mkdir -p "${DIST_FRONT}/dist"
          cp -r frontend/dist/* "${DIST_FRONT}/dist/"
          if [ -d "devops/distribution/frontend" ]; then
            cp -r devops/distribution/frontend/* "${DIST_FRONT}/"
          fi

          {
            echo "Aplicacion: incident-hub-frontend"
            echo "Version: ${EXPECTED_TAG}"
            echo "Commit SHA: ${EXPECTED_SHA}"
            echo "Commit Corto: ${EXPECTED_SHORT_SHA}"
            echo "Fecha de Build: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "Plataforma: GitHub Actions (ubuntu-latest)"
            echo "Entorno: React 18 / Vite 6.4 (Node.js 20 LTS)"
          } > "${DIST_FRONT}/BUILD_INFO.txt"

          FRONTEND_ZIP="incident-hub-frontend-${EXPECTED_TAG}-${EXPECTED_SHORT_SHA}.zip"
          (cd "${DIST_FRONT}" && zip -r "../${FRONTEND_ZIP}" *)
          echo "FRONTEND_ZIP=${FRONTEND_ZIP}" >> "$GITHUB_ENV"
          echo "✔ Paquete Frontend generado: ${FRONTEND_ZIP}"

      # ------------------------------------------------------------------------
      # Generación de Checksums Criptográficos y Notas de Release Formales
      # ------------------------------------------------------------------------
      - name: 🔐 Generar Checksums SHA-256 y Archivo de Notas Formal
        run: |
          set -euo pipefail

          echo "=== Generando archivo SHA256SUMS.txt ==="
          sha256sum "${BACKEND_ZIP}" "${FRONTEND_ZIP}" > SHA256SUMS.txt
          echo "Checksums calculados:"
          cat SHA256SUMS.txt

          echo "=== Construyendo archivo RELEASE_NOTES.md con datos reales ==="
          RELEASE_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          if [ "${IS_PRERELEASE}" = "true" ]; then
            RELEASE_KIND="Pre-release (Release Candidate / Beta)"
          else
            RELEASE_KIND="Versión Oficial Estable"
          fi

          {
            echo "## 🚀 IT Incident Hub - Release ${EXPECTED_TAG}"
            echo ""
            echo "### 📋 Trazabilidad de Versión"
            echo "- **Tag Oficial:** \`${EXPECTED_TAG}\`"
            echo "- **Commit SHA Resuelto:** \`${EXPECTED_SHA}\`"
            echo "- **Commit Corto:** \`${EXPECTED_SHORT_SHA}\`"
            echo "- **Workflow Run ID:** \`${GITHUB_RUN_ID}\`"
            echo "- **Fecha de Publicación:** ${RELEASE_DATE}"
            echo "- **Tipo de Versión:** ${RELEASE_KIND}"
            echo "- **Garantía de Calidad:** Validado al 100% por compuerta de calidad obligatoria (22 pruebas backend, pruebas frontend con cobertura, auditoría de dependencias y cero secretos)."
            echo ""
            echo "### 📦 Artefactos Publicados"
            echo "- \`${BACKEND_ZIP}\`"
            echo "- \`${FRONTEND_ZIP}\`"
            echo "- \`SHA256SUMS.txt\`"
            echo ""
            echo "### 🔐 Verificación de Integridad (SHA-256)"
            echo "Para verificar la integridad criptográfica de los paquetes descargados, ejecute:"
            echo '```bash'
            echo "sha256sum -c SHA256SUMS.txt"
            echo '```'
            echo ""
            echo "**Hashes SHA-256 verificados:**"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo ""
            echo "---"
            echo "*Artefactos compilados, verificados y publicados de forma reproducible por GitHub Actions.*"
          } > RELEASE_NOTES.md

      # ------------------------------------------------------------------------
      # Publicación Oficial del Release en GitHub
      # ------------------------------------------------------------------------
      - name: 📦 Publicar Release en GitHub con Artefactos y Checksums
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.EXPECTED_TAG }}
          target_commitish: ${{ env.EXPECTED_SHA }}
          name: "IT Incident Hub ${{ env.EXPECTED_TAG }}"
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          generate_release_notes: true
          make_latest: ${{ env.IS_PRERELEASE == 'false' }}
          body_path: RELEASE_NOTES.md
          files: |
            ${{ env.BACKEND_ZIP }}
            ${{ env.FRONTEND_ZIP }}
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
