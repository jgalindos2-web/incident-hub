name: CI/CD Quality, Build & Test Pipeline (GitHub Actions)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==============================================================================
  # Job 1: Backend (Spring Boot 3 - Java 17 - Maven)
  # ==============================================================================
  backend-pipeline:
    name: Backend - Compilación, Pruebas Unitarias e Integradas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Clonar Código Fuente
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🔍 1. Validar Estándares de Código (Checkstyle Linter)
        run: mvn checkstyle:check -B

      - name: 🔨 2. Compilar Proyecto Backend
        run: mvn compile -B

      - name: 🧪 3. Ejecutar Pruebas Unitarias e Integradas (JUnit 5 + Mockito + H2)
        run: mvn test -B

      - name: 📦 4. Empaquetar Artefacto JAR de Producción
        run: mvn package -DskipTests -B

      - name: 📊 5. Publicar Reportes Surefire de Pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

      - name: 💾 6. Publicar Artefacto Binario JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: incident-hub-backend-jar
          path: backend/target/*.jar
          retention-days: 14

  # ==============================================================================
  # Job 2: Frontend (React 18 - Vite - Vitest)
  # ==============================================================================
  frontend-pipeline:
    name: Frontend - Compilación, Linter y Pruebas Unitarias
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Clonar Código Fuente
        uses: actions/checkout@v4

      - name: 🟩 Configurar Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 1. Instalar Dependencias (npm ci)
        run: npm ci

      - name: 🔍 2. Validar Código con Linter (ESLint)
        run: npm run lint

      - name: 🧪 3. Ejecutar Pruebas Unitarias (Vitest)
        run: npm run test

      - name: 🚀 4. Compilar Bundle de Producción (Vite Build)
        run: npm run build

      - name: 💾 5. Publicar Bundle de Distribución Frontend (dist)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: incident-hub-frontend-dist
          path: frontend/dist/
          retention-days: 14

  # ==============================================================================
  # Job 3: Quality Gate Consolidado
  # ==============================================================================
  ci-status-check:
    name: Validación Global de Pipeline CI
    runs-on: ubuntu-latest
    needs: [ backend-pipeline, frontend-pipeline ]
    steps:
      - name: ✅ Confirmación de Calidad y Compilación
        run: |
          echo "=========================================================="
          echo "🎉 PIPELINE COMPLETADO EXITOSAMENTE EN GITHUB ACTIONS 🎉"
          echo "✔ Compilación Backend Spring Boot: EXITOSA"
          echo "✔ Pruebas Unitarias e Integradas Backend: EXITOSAS"
          echo "✔ Compilación Frontend Vite: EXITOSA"
          echo "✔ Pruebas Unitarias Frontend Vitest: EXITOSAS"
          echo "✔ Linter Backend (Checkstyle) & Frontend (ESLint): 0 ERRORES"
          echo "=========================================================="
