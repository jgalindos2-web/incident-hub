name: GitHub Mirror Quality & Security Gate

on:
  # Se ejecuta ante push en cualquier rama originada por el Mirroring desde GitLab
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==============================================================================
  # Job Único Consolidado: Seguridad, Linters, Pruebas y Notificación a GitLab
  # ==============================================================================
  mirror-quality-gate:
    name: 🛡️ Mirror Validation & Security Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Código Fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------------
      # Paso 1: Notificar inicio de validación a la API de GitLab (Status: running)
      # ------------------------------------------------------------------------
      - name: 📡 Notificar estado inicial a GitLab Commit Status API
        if: always()
        run: |
          if [ -n "${{ secrets.GITLAB_TOKEN }}" ] && [ -n "${{ secrets.GITLAB_PROJECT_ID }}" ]; then
            echo "Notificando a GitLab que la validación en GitHub Actions ha iniciado..."
            curl --silent --show-error --request POST \
              --header "PRIVATE-TOKEN: ${{ secrets.GITLAB_TOKEN }}" \
              "https://gitlab.com/api/v4/projects/${{ secrets.GITLAB_PROJECT_ID }}/statuses/${{ github.sha }}?state=running&name=github-actions/quality-gate&description=Evaluando+linter,+seguridad+y+pruebas&target_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              || true
          else
            echo "ℹ️ Variables secretas GITLAB_TOKEN / GITLAB_PROJECT_ID no provistas; omitiendo notificación API inicial."
          fi

      # ------------------------------------------------------------------------
      # Paso 2: Verificación Anti-Filtración de Archivos .env y Secretos
      # ------------------------------------------------------------------------
      - name: 🔒 1. Detección de Archivos .env y Credenciales en Git
        run: |
          echo "=========================================================="
          echo "🔍 Verificando cumplimiento de la directriz: ZERO .ENV IN GIT"
          echo "=========================================================="
          
          # Buscar archivos que comiencen por .env y que no sean la plantilla .env.example
          ENV_FILES=$(find . -type f -name ".env*" ! -name ".env.example" ! -path "*/node_modules/*" ! -path "*/target/*" || true)
          
          if [ -n "$ENV_FILES" ]; then
            echo "❌ ERROR CRÍTICO DE SEGURIDAD:"
            echo "Se encontraron archivos .env prohibidos en el repositorio:"
            echo "$ENV_FILES"
            echo "Queda estrictamente prohibido commitear archivos de variables de entorno."
            exit 1
          fi
          
          # Escaneo de certificados y claves privadas
          PRIVATE_KEYS=$(git grep -EI "BEGIN (RSA|OPENSSH|EC|DSA|PGP)? PRIVATE KEY" || true)
          if [ -n "$PRIVATE_KEYS" ]; then
            echo "❌ ERROR CRÍTICO: Se detectaron llaves privadas o certificados en el código:"
            echo "$PRIVATE_KEYS"
            exit 1
          fi
          
          echo "✔ Control de secretos superado: No se encontraron credenciales ni archivos .env."

      # ------------------------------------------------------------------------
      # Paso 3: Configuración y Validación de Frontend (Linter ESLint)
      # ------------------------------------------------------------------------
      - name: 🟩 Configurar Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 2. Instalar Dependencias Frontend e Invocar Linter
        working-directory: ./frontend
        run: |
          echo "Ejecutando npm ci e inspección de estilo con ESLint..."
          npm ci --prefer-offline
          npm run lint

      # ------------------------------------------------------------------------
      # Paso 4: Configuración y Validación de Backend (Java 17 + Checkstyle + Tests)
      # ------------------------------------------------------------------------
      - name: ☕ Configurar Java 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🔍 3. Validar Estándares de Código Backend (Checkstyle)
        working-directory: ./backend
        run: mvn checkstyle:check -B

      - name: 🧪 4. Ejecutar Pruebas Unitarias de Backend (JUnit 5 + Mockito)
        working-directory: ./backend
        run: mvn test -B -Dtest=*Test

      # ------------------------------------------------------------------------
      # Paso 5: Notificación Final a la API de GitLab (Status: success / failed)
      # ------------------------------------------------------------------------
      - name: 📢 Notificar éxito de validación a GitLab Commit Status API
        if: success()
        run: |
          if [ -n "${{ secrets.GITLAB_TOKEN }}" ] && [ -n "${{ secrets.GITLAB_PROJECT_ID }}" ]; then
            echo "Notificando resultado EXITOSO (Check verde) a GitLab..."
            curl --silent --show-error --request POST \
              --header "PRIVATE-TOKEN: ${{ secrets.GITLAB_TOKEN }}" \
              "https://gitlab.com/api/v4/projects/${{ secrets.GITLAB_PROJECT_ID }}/statuses/${{ github.sha }}?state=success&name=github-actions/quality-gate&description=GitHub+Actions:+Validaciones+aprobadas+con+%C3%A9xito&target_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              || true
          fi
          echo "=========================================================="
          echo "🎉 VALIDACIÓN COMPLETA DE MIRROR EXITOSA EN GITHUB 🎉"
          echo "=========================================================="

      - name: 📢 Notificar fallo de validación a GitLab Commit Status API
        if: failure()
        run: |
          if [ -n "${{ secrets.GITLAB_TOKEN }}" ] && [ -n "${{ secrets.GITLAB_PROJECT_ID }}" ]; then
            echo "Notificando resultado FALLIDO (X roja) a GitLab..."
            curl --silent --show-error --request POST \
              --header "PRIVATE-TOKEN: ${{ secrets.GITLAB_TOKEN }}" \
              "https://gitlab.com/api/v4/projects/${{ secrets.GITLAB_PROJECT_ID }}/statuses/${{ github.sha }}?state=failed&name=github-actions/quality-gate&description=GitHub+Actions:+Fallaron+pruebas,+linter+o+detecci%C3%B3n+.env&target_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              || true
          fi
          echo "❌ La validación complementaria en GitHub Actions ha fallado."
